# Shared CI for crashoutcompany Next.js apps.
#
# Callers:
#   jobs:
#     ci:
#       uses: crashoutcompany/.github/.github/workflows/ci.yml@v1
#       with: { ... }
#       secrets: inherit
#
# Jobs: lint (+ typecheck) -> unit tests -> Vercel build -> Playwright e2e on a
# Neon branch. Build and e2e are skipped for fork PRs and Dependabot because
# they need repository secrets. With `dependabot-build: true` the build job also
# runs for Dependabot, as a plain build script with placeholder env.
#
# Secrets / variables read from the calling repository:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (build)
#   NEON_API_KEY, NEON_PROJECT_ID (secret or var)    (e2e)
#   NEON_DATABASE, NEON_ROLE (optional, secret or var; `neon-database` / `neon-role` inputs win)
#   NEON_CI_PARENT_BRANCH (var, required for e2e; `neon-parent` input wins).
#     Point it at a seeded/scrubbed branch, never the production branch:
#     PR code runs against branches copied from it.
#   DATABASE_URL, DIRECT_URL, BETTER_AUTH_SECRET, TEST_AUTH_SECRET (optional; else Vercel, else CI-only value)
#   Any names listed in `e2e-secret-names` (JSON array) or `e2e-secrets` (space-separated) (e2e)
name: ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      pnpm-version:
        type: string
        default: "10.1.0"
      install-flags:
        description: Extra flags for `pnpm install --frozen-lockfile`.
        type: string
        default: ""
      needs-prisma:
        description: Run `prisma db push` + `prisma generate --sql` against the CI Postgres before lint/test.
        type: boolean
        default: false
      postgres-service:
        description: Start a Postgres 16 service container for the lint and test jobs. Set false for apps without a database to skip it.
        type: boolean
        default: true
      has-typecheck:
        type: boolean
        default: true
      test-script:
        description: package.json script for unit tests.
        type: string
        default: test
      has-build:
        description: Run `vercel build` against the pulled Vercel environment.
        type: boolean
        default: true
      has-e2e:
        type: boolean
        default: false
      use-prisma-neon:
        description: Ask create-branch-action for Prisma-shaped connection URLs.
        type: boolean
        default: false
      sync-prisma-neon:
        description: Run `prisma db push` + `prisma generate --sql` on the Neon branch before e2e.
        type: boolean
        default: false
      prisma-migrate-neon:
        description: Run `prisma migrate deploy` on the e2e job's ephemeral Neon branch (direct URL) before e2e, so migrations added in the PR exist on a branch copied from an older parent. Opt-in; never touches the parent or production branch.
        type: boolean
        default: false
      neon-database:
        description: Neon database name. Overrides NEON_DATABASE; empty uses NEON_DATABASE (secret or variable), then neondb.
        type: string
        default: ""
      neon-role:
        description: Neon role name. Overrides NEON_ROLE; empty uses NEON_ROLE (secret or variable), then neondb_owner.
        type: string
        default: ""
      neon-parent:
        description: Neon branch that e2e branches are created from. Overrides NEON_CI_PARENT_BRANCH (variable). Required when has-e2e is true, so CI never silently copies the production branch.
        type: string
        default: ""
      e2e-neon-parent:
        description: Neon branch the e2e branch is created from, for e2e only. Overrides neon-parent and NEON_CI_PARENT_BRANCH; empty falls back to them. Never point it at production.
        type: string
        default: ""
      e2e-branch-expires-minutes:
        description: Minutes until the e2e Neon branch expires on its own (create-branch-action expires_at), so a killed run cannot leak it. 0 disables expiry. Keep it above the e2e job timeout (45) plus queue time; 120 is a good value.
        type: number
        default: 0
      e2e-cleanup-stale:
        description: Before creating the e2e branch, delete leftover ci/e2e-pr<N>-* branches of the same PR whose run has finished (or that are over 2h old), and delete this run's branch by name when branch creation itself failed. Frees Neon branch slots; the finished-run check needs actions read permission, else it falls back to age.
        type: boolean
        default: false
      e2e-better-auth-url:
        description: BETTER_AUTH_URL for the e2e server. Empty leaves it unset.
        type: string
        default: ""
      vercel-version:
        description: Exact vercel CLI version installed for the build job. Pinned so a bad release cannot break every repo or run with VERCEL_TOKEN; bump deliberately.
        type: string
        default: "65.14.0"
      e2e-secrets:
        description: Space-separated repository secret names to expose to the e2e job.
        type: string
        default: ""
      e2e-secret-names:
        description: 'JSON array of repository secret names to expose to the e2e job (max 16), e.g. ["RESEND_API_KEY"]. Only these secrets are looked up, one by name; toJSON(secrets) is not used. When set, e2e-secrets is ignored.'
        type: string
        default: ""
      dependabot-build:
        description: Also run the build job for Dependabot PRs. Dependabot runs have no Actions secrets, so it skips `vercel pull`/`vercel build` and runs the caller's package.json script from `dependabot-build-script` with placeholder env. e2e stays skipped for Dependabot.
        type: boolean
        default: false
      dependabot-build-script:
        description: package.json script run by the Dependabot build (only when dependabot-build is true).
        type: string
        default: build
      dependabot-build-env:
        description: Placeholder env for the Dependabot build, one KEY=VALUE per line (blank lines and # comments ignored). Not secrets. DATABASE_URL, DIRECT_URL, BETTER_AUTH_SECRET and TEST_AUTH_SECRET default to the CI fixtures.
        type: string
        default: ""

env:
  # Fixtures for lint/test against the job's Postgres service. Not real secrets.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
  TEST_AUTH_SECRET: ci-only-test-auth-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        # An empty image skips the service (documented), so postgres-service: false drops it.
        image: ${{ inputs.postgres-service && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ inputs.install-flags }}
      - name: Apply Prisma schema
        if: inputs.needs-prisma
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm lint
      - name: Typecheck
        if: inputs.has-typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # An empty image skips the service (documented), so postgres-service: false drops it.
        image: ${{ inputs.postgres-service && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ inputs.install-flags }}
      - name: Apply Prisma schema
        if: inputs.needs-prisma
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm ${{ inputs.test-script }}

  build:
    if: inputs.has-build && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.actor != 'dependabot[bot]' || inputs.dependabot-build)))
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Optional repo secrets; blank ones are unset below so Vercel's value wins.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
      # Dependabot (or a re-run of its PR) has no repository secrets: build with placeholders instead of Vercel.
      DEPENDABOT_BUILD: ${{ inputs.dependabot-build && github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!**/node_modules/**', '!.next/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile ${{ inputs.install-flags }}
      - name: Install Vercel CLI
        env:
          VERCEL_VERSION: ${{ inputs.vercel-version }}
        run: pnpm add --global "vercel@${VERCEL_VERSION}"
      - name: Pull Vercel environment and build
        if: env.DEPENDABOT_BUILD != 'true'
        run: |
          # `vercel build` never overrides a variable that is already set, even
          # to "", so only keep the repo secrets that actually have a value.
          for k in DATABASE_URL DIRECT_URL BETTER_AUTH_SECRET TEST_AUTH_SECRET; do
            [ -n "${!k:-}" ] || unset "$k"
          done
          # Only export the IDs when both are set; otherwise fall back to the
          # repo's .vercel/project.json link.
          if [ -n "$ORG_ID" ] && [ -n "$PROJECT_ID" ]; then
            export VERCEL_ORG_ID="$ORG_ID" VERCEL_PROJECT_ID="$PROJECT_ID"
          fi
          vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

          # Vercel Sensitive variables are write-only: `vercel pull` writes them
          # blank. This build is only a compile check (the output is never
          # deployed), so fill in a CI-only value when nothing real is available.
          envfile=".vercel/.env.${VERCEL_ENV}.local"
          ensure() {
            if [ -z "${!1:-}" ] && ! grep -Eq "^$1=\"?[^\"[:space:]]" "$envfile"; then
              echo "::notice::$1 is not readable from Vercel (Sensitive?); using a CI-only value for this compile check"
              printf '\n%s="%s"\n' "$1" "$2" >> "$envfile"
            fi
          }
          ensure BETTER_AUTH_SECRET ci-only-better-auth-secret-at-least-32-characters
          ensure TEST_AUTH_SECRET ci-only-test-auth-secret

          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      # No secrets and no Vercel: a compile check of the dependency bump with
      # placeholder env, through the caller's own build script.
      - name: Build (Dependabot, placeholder env)
        if: env.DEPENDABOT_BUILD == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
          TEST_AUTH_SECRET: ci-only-test-auth-secret
          PLACEHOLDER_ENV: ${{ inputs.dependabot-build-env }}
          BUILD_SCRIPT: ${{ inputs.dependabot-build-script }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            if [[ "$line" != *=* || ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::dependabot-build-env: expected KEY=VALUE, got a bad line"
              exit 1
            fi
            export "$key=${line#*=}"
          done <<<"$PLACEHOLDER_ENV"
          pnpm run "$BUILD_SCRIPT"

  e2e:
    # Also check the PR author: a human re-run of a Dependabot PR makes the human the actor.
    if: inputs.has-e2e && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!**/node_modules/**', '!.next/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Expose requested secrets (named)
        if: inputs.e2e-secret-names != ''
        env:
          NAMES: ${{ inputs.e2e-secret-names }}
          V0: ${{ fromJSON(inputs.e2e-secret-names || '[]')[0] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[0]] || '' }}
          V1: ${{ fromJSON(inputs.e2e-secret-names || '[]')[1] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[1]] || '' }}
          V2: ${{ fromJSON(inputs.e2e-secret-names || '[]')[2] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[2]] || '' }}
          V3: ${{ fromJSON(inputs.e2e-secret-names || '[]')[3] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[3]] || '' }}
          V4: ${{ fromJSON(inputs.e2e-secret-names || '[]')[4] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[4]] || '' }}
          V5: ${{ fromJSON(inputs.e2e-secret-names || '[]')[5] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[5]] || '' }}
          V6: ${{ fromJSON(inputs.e2e-secret-names || '[]')[6] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[6]] || '' }}
          V7: ${{ fromJSON(inputs.e2e-secret-names || '[]')[7] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[7]] || '' }}
          V8: ${{ fromJSON(inputs.e2e-secret-names || '[]')[8] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[8]] || '' }}
          V9: ${{ fromJSON(inputs.e2e-secret-names || '[]')[9] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[9]] || '' }}
          V10: ${{ fromJSON(inputs.e2e-secret-names || '[]')[10] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[10]] || '' }}
          V11: ${{ fromJSON(inputs.e2e-secret-names || '[]')[11] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[11]] || '' }}
          V12: ${{ fromJSON(inputs.e2e-secret-names || '[]')[12] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[12]] || '' }}
          V13: ${{ fromJSON(inputs.e2e-secret-names || '[]')[13] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[13]] || '' }}
          V14: ${{ fromJSON(inputs.e2e-secret-names || '[]')[14] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[14]] || '' }}
          V15: ${{ fromJSON(inputs.e2e-secret-names || '[]')[15] && secrets[fromJSON(inputs.e2e-secret-names || '[]')[15]] || '' }}
        run: |
          count="$(jq -e 'if type == "array" and all(.[]; type == "string") then length else error("not an array of strings") end' <<<"$NAMES")" \
            || { echo "::error::e2e-secret-names must be a JSON array of strings"; exit 1; }
          if [ "$count" -gt 16 ]; then
            echo "::error::e2e-secret-names supports at most 16 names"
            exit 1
          fi
          for i in $(seq 0 $((count - 1))); do
            name="$(jq -r --argjson i "$i" '.[$i]' <<<"$NAMES")"
            if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Invalid secret name in e2e-secret-names"
              exit 1
            fi
            var="V$i"
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::warning::Secret $name is not set"
              continue
            fi
            echo "::add-mask::$value"
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
          done

      - name: Expose requested secrets
        if: inputs.e2e-secrets != '' && inputs.e2e-secret-names == ''
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          NAMES: ${{ inputs.e2e-secrets }}
        run: |
          for name in $NAMES; do
            value="$(jq -r --arg n "$name" '.[$n] // empty' <<<"$ALL_SECRETS")"
            if [ -z "$value" ]; then
              echo "::warning::Secret $name is not set"
              continue
            fi
            echo "::add-mask::$value"
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
          done

      # Every e2e run gets its own throwaway branch, deleted below even when the
      # tests fail or the run is cancelled. PRs used to reuse the long-lived
      # preview/pr-* branch from neon-branches.yml, so a run finishing after the
      # merge could recreate the branch that job had just deleted. Anything a
      # killed run leaves behind is swept by neon-sweep.yml (ci/e2e-* older than 6h).
      - name: Resolve Neon branch
        id: neon
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
          EXPIRES_MINUTES: ${{ inputs.e2e-branch-expires-minutes }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf 'name=ci/e2e-pr%s-%s-%s\n' "$PR_NUMBER" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            printf 'name=ci/e2e-%s\n' "$GIT_SHA" >> "$GITHUB_OUTPUT"
          fi
          printf 'ephemeral=true\n' >> "$GITHUB_OUTPUT"
          if [ "${EXPIRES_MINUTES:-0}" -gt 0 ]; then
            printf 'expires_at=%s\n' "$(date -u -d "+${EXPIRES_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

      # Without an explicit parent, Neon copies the project's default branch,
      # which is production data. Fail instead of silently doing that.
      - name: Require Neon CI parent branch
        env:
          NEON_PARENT: ${{ inputs.e2e-neon-parent || inputs.neon-parent || vars.NEON_CI_PARENT_BRANCH }}
        run: |
          if [ -z "$NEON_PARENT" ]; then
            echo "::error::Set the NEON_CI_PARENT_BRANCH repository variable (or the neon-parent input) to a seeded/scrubbed Neon branch. PR branches must not be copied from production."
            exit 1
          fi

      # Opt-in (e2e-cleanup-stale). Frees Neon branch slots held by e2e branches
      # that earlier runs of this PR leaked (runner lost, force-cancelled). A
      # branch is stale when its run is completed, when it is from an earlier
      # attempt of this run, or, if the run lookup fails, when it is over 2h old
      # (longer than the job timeout), so a live run's branch is never deleted.
      # Only this PR's ci/e2e-pr<N>-* names are considered. The name pieces are
      # validated as digits before use and reach commands through env only.
      - name: Delete stale e2e Neon branches
        if: inputs.e2e-cleanup-stale && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OWN_BRANCH: ${{ steps.neon.outputs.name }}
        run: |
          npm i -g neonctl@2.47.0 >/dev/null
          rows="$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json \
            | jq -r --arg p "ci/e2e-pr${PR_NUMBER}-" 'if type == "array" then .[] | select(.name | startswith($p)) | "\(.id)\t\(.name)\t\(.created_at)" else error("neonctl branches list did not return an array") end')"
          now="$(date +%s)"
          while IFS=$'\t' read -r id name created; do
            [ -n "$id" ] || continue
            [ "$name" = "$OWN_BRANCH" ] && continue
            rest="${name#ci/e2e-pr"${PR_NUMBER}"-}"
            run="${rest%%-*}"
            attempt="${rest#*-}"
            [[ "$run" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || continue
            reason=""
            if [ "$run" = "$RUN_ID" ] && [ "$attempt" -lt "$RUN_ATTEMPT" ]; then
              reason="earlier attempt of this run"
            elif status="$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status 2>/dev/null)"; then
              [ "$status" = completed ] && reason="run $run is completed"
            else
              ts="$(date -d "$created" +%s 2>/dev/null)" || continue
              [ $((now - ts)) -ge 7200 ] && reason="run $run not readable and branch is over 2h old"
            fi
            [ -n "$reason" ] || continue
            if neonctl branches delete "$id" --project-id "$NEON_PROJECT_ID" >/dev/null; then
              echo "Deleted stale $name: $reason"
            else
              echo "::warning::Could not delete stale $name"
            fi
          done <<<"$rows"

      - name: Create Neon branch
        id: database
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          parent_branch: ${{ inputs.e2e-neon-parent || inputs.neon-parent || vars.NEON_CI_PARENT_BRANCH }}
          expires_at: ${{ steps.neon.outputs.expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ inputs.neon-database || secrets.NEON_DATABASE || vars.NEON_DATABASE || 'neondb' }}
          role: ${{ inputs.neon-role || secrets.NEON_ROLE || vars.NEON_ROLE || 'neondb_owner' }}
          prisma: ${{ inputs.use-prisma-neon }}

      - name: Install dependencies
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
        run: pnpm install --frozen-lockfile

      # Applies the PR's migration files to this run's throwaway branch only: the
      # URLs come from the create-branch step above, never from secrets. The
      # direct URL is used for both variables because migrate deploy takes
      # advisory locks, which don't work through the pooler, and some
      # prisma.config.ts files read only DATABASE_URL.
      - name: Apply Prisma migrations to Neon branch
        if: inputs.prisma-migrate-neon
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
        run: pnpm exec prisma migrate deploy

      - name: Sync Prisma schema to Neon branch
        if: inputs.sync-prisma-neon
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql

      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run authenticated E2E
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
          EXPOSE_TESTING_API: "1"
          E2E_BETTER_AUTH_URL: ${{ inputs.e2e-better-auth-url }}
        run: |
          if [ -n "$E2E_BETTER_AUTH_URL" ]; then
            export BETTER_AUTH_URL="$E2E_BETTER_AUTH_URL"
          fi
          pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon.outputs.ephemeral == 'true' && steps.database.outcome == 'success'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: ${{ steps.database.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # create-branch-action can fail after Neon already made the branch (for
      # example while waiting for the endpoint), which the step above skips
      # because it needs a branch ID. Delete by name in that case.
      - name: Delete e2e Neon branch after a failed create
        if: always() && inputs.e2e-cleanup-stale && steps.neon.outputs.ephemeral == 'true' && steps.database.outcome == 'failure'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          BRANCH: ${{ steps.neon.outputs.name }}
        run: |
          npm i -g neonctl@2.47.0 >/dev/null
          if out=$(neonctl branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID" 2>&1); then
            echo "$out"
          elif grep -qi 'not found' <<<"$out"; then
            echo "No Neon branch $BRANCH; nothing to delete."
          else
            echo "::warning::Could not delete $BRANCH: $out"
          fi
