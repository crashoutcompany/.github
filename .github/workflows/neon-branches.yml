# Shared Neon preview branches: one `preview/pr-<number>-<head-ref>` branch
# per same-repo PR, created on open/reopen and deleted on close. ci.yml's e2e
# job does not use it: PR e2e runs get their own throwaway `ci/e2e-*` branch.
#
# Callers:
#   on:
#     pull_request:
#       types: [opened, reopened]
#     pull_request_target:
#       types: [closed]
#   jobs:
#     neon:
#       uses: crashoutcompany/.github/.github/workflows/neon-branches.yml@<full commit sha> # v1
#       secrets: inherit
#
# Pin callers to a commit SHA, not the moving `v1` tag: with `secrets: inherit`
# this code runs with the app's Neon API key, so a retagged `v1` would change it
# silently. See the README.
#
# Close runs on pull_request_target because GitHub skips `pull_request`
# workflows (closed included) for PRs with merge conflicts, so a PR closed while
# conflicting would keep its Neon branch. That is safe here: the workflow runs
# from the base branch and the `delete` job only calls the Neon API. Never add a
# checkout of the PR head or run PR code in this workflow.
#
# The branch name comes from the PR's head ref, which neondatabase's actions
# paste into shell scripts, so it is reduced to [A-Za-z0-9._-] (`/` and anything
# else becomes `-`).
#
# Missed deletes (and branches recreated after one) are caught by neon-sweep.yml.
#
# Reads NEON_API_KEY and NEON_PROJECT_ID (secret or var), plus optional
# NEON_DATABASE / NEON_ROLE (secret or var) from the calling repository.
# Requires NEON_CI_PARENT_BRANCH (var) or the `neon-parent` input: a
# seeded/scrubbed branch such as `development`, never main/production, because
# PR code runs against branches copied from it.
#
# Vercel (optional): when VERCEL_TOKEN (secret) is set, `create` also upserts the
# new branch's connection strings as Vercel project env vars scoped to the
# preview target and the PR's head ref (`gitBranch`), so that PR's preview
# deploys use its own Neon branch instead of the shared DATABASE_URL. `delete`
# removes them again. Without VERCEL_TOKEN both steps log a notice and skip.
# Needs VERCEL_PROJECT_ID (secret or var) and, for a team project,
# VERCEL_TEAM_ID (secret or var). The pooled URL goes to the key named by
# `vercel-database-url-key` (default DATABASE_URL), the direct URL to
# `vercel-direct-url-key` (default DIRECT_URL; empty disables it). The token
# needs write access to the project's env vars.
# Race: Vercel starts the first preview build of a newly opened PR in parallel
# with this job, so that build may run before the env vars exist and read the
# fallback value. Redeploy the preview once (or push again) after this job passes.
#
# Preview branches also expire `expires-in-days` days (default 30) after creation,
# as a safety net for PRs abandoned without being closed. This workflow only runs
# on open/reopen/close, so a PR left open longer than that loses its preview
# branch; reopen the PR or raise the input. 0 disables expiry.
name: neon-branches

on:
  workflow_call:
    inputs:
      neon-database:
        description: Neon database name. Overrides NEON_DATABASE; empty uses NEON_DATABASE (secret or variable), then neondb.
        type: string
        default: ""
      neon-role:
        description: Neon role name. Overrides NEON_ROLE; empty uses NEON_ROLE (secret or variable), then neondb_owner.
        type: string
        default: ""
      neon-parent:
        description: Neon branch that PR branches are created from. Overrides NEON_CI_PARENT_BRANCH (variable). Required.
        type: string
        default: ""
      expires-in-days:
        description: Days until a preview branch expires. 0 disables expiry.
        type: number
        default: 30
      vercel-database-url-key:
        description: Vercel env var that receives the pooled Neon URL (only used when VERCEL_TOKEN is set).
        type: string
        default: DATABASE_URL
      vercel-direct-url-key:
        description: Vercel env var that receives the direct (unpooled) Neon URL. Empty string disables it.
        type: string
        default: DIRECT_URL

jobs:
  create:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon branch
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          EXPIRES_IN_DAYS: ${{ inputs.expires-in-days }}
        run: |
          safe_ref="$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9._-' '-')"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
          if [ "${EXPIRES_IN_DAYS:-0}" -gt 0 ]; then
            printf 'expires_at=%s\n' "$(date -u -d "+${EXPIRES_IN_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi
      # Without an explicit parent, Neon copies the project's default branch,
      # which is production data. Fail instead of silently doing that.
      - name: Require Neon CI parent branch
        env:
          NEON_PARENT: ${{ inputs.neon-parent || vars.NEON_CI_PARENT_BRANCH }}
        run: |
          if [ -z "$NEON_PARENT" ]; then
            echo "::error::Set the NEON_CI_PARENT_BRANCH repository variable (or the neon-parent input) to a seeded/scrubbed Neon branch. PR branches must not be copied from production."
            exit 1
          fi
      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          parent_branch: ${{ inputs.neon-parent || vars.NEON_CI_PARENT_BRANCH }}
          expires_at: ${{ steps.neon.outputs.expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ inputs.neon-database || secrets.NEON_DATABASE || vars.NEON_DATABASE || 'neondb' }}
          role: ${{ inputs.neon-role || secrets.NEON_ROLE || vars.NEON_ROLE || 'neondb_owner' }}
      # Everything reaches the script through env, never through ${{ }} in the
      # script body: the head ref is attacker-controlled and the URLs are secrets.
      # The Vercel scope is the raw head ref (what Vercel matches deployments
      # against), not the sanitized Neon branch name.
      - name: Publish Neon URLs to Vercel preview env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          GIT_BRANCH: ${{ github.head_ref }}
          DB_URL_KEY: ${{ inputs.vercel-database-url-key }}
          DIRECT_URL_KEY: ${{ inputs.vercel-direct-url-key }}
          POOLED_URL: ${{ steps.branch.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set; skipping Vercel preview env update."
            exit 0
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN is set but VERCEL_PROJECT_ID (secret or variable) is not."
            exit 1
          fi
          [ -n "$POOLED_URL" ] && echo "::add-mask::$POOLED_URL"
          [ -n "$DIRECT_URL" ] && echo "::add-mask::$DIRECT_URL"

          api="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true"
          [ -n "$VERCEL_TEAM_ID" ] && api="${api}&teamId=${VERCEL_TEAM_ID}"

          # $1 = Vercel env var name, $2 = its value. The body can echo request
          # details, so only the HTTP status and Vercel's error code are logged.
          upsert() {
            local key="$1" value="$2" body code
            body="$(mktemp)"
            code="$(KEY="$key" VALUE="$value" jq -n '{
                key: $ENV.KEY, value: $ENV.VALUE, type: "encrypted",
                target: ["preview"], gitBranch: $ENV.GIT_BRANCH
              }' | curl -sS -o "$body" -w '%{http_code}' -X POST "$api" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H 'Content-Type: application/json' --data-binary @-)" || code=000
            case "$code" in
              2??) echo "Set $key on Vercel (preview, branch $GIT_BRANCH)." ;;
              *)
                echo "::error::Vercel rejected $key: HTTP $code ($(jq -r '.error.code // "no error code"' "$body" 2>/dev/null))"
                rm -f "$body"
                exit 1
                ;;
            esac
            rm -f "$body"
          }

          if [ -z "$POOLED_URL" ]; then
            echo "::error::create-branch-action returned no pooled URL (db_url_pooled)."
            exit 1
          fi
          upsert "$DB_URL_KEY" "$POOLED_URL"
          if [ -n "$DIRECT_URL_KEY" ]; then
            if [ -z "$DIRECT_URL" ]; then
              echo "::error::create-branch-action returned no direct URL (db_url)."
              exit 1
            fi
            upsert "$DIRECT_URL_KEY" "$DIRECT_URL"
          fi

  delete:
    # Dependabot-triggered events get Dependabot's secrets, not the repository's,
    # so there is no Neon key to delete with.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon branch
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe_ref="$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9._-' '-')"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
      # neondatabase/delete-branch-action fails when the branch doesn't exist,
      # which is the normal case for Dependabot PRs (create skips them) and for
      # PRs whose branch already expired. The name also reaches neonctl through
      # the environment, not by being pasted into a script.
      - name: Install neonctl
        run: npm i -g neonctl@2.47.0
      - name: Delete Neon branch if it exists
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          BRANCH: ${{ steps.neon.outputs.name }}
        run: |
          if out=$(neonctl branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID" 2>&1); then
            echo "$out"
          elif grep -qi 'not found' <<<"$out"; then
            echo "No Neon branch $BRANCH; nothing to delete."
          else
            echo "$out" >&2
            exit 1
          fi
      # Removes only the two keys this workflow manages (see the inputs), scoped
      # to this head ref and the preview target, so branch-scoped variables set by
      # hand survive. As above, nothing from the PR is interpolated into the script.
      - name: Delete Vercel preview env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          GIT_BRANCH: ${{ github.head_ref }}
          DB_URL_KEY: ${{ inputs.vercel-database-url-key }}
          DIRECT_URL_KEY: ${{ inputs.vercel-direct-url-key }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set; skipping Vercel preview env cleanup."
            exit 0
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN is set but VERCEL_PROJECT_ID (secret or variable) is not."
            exit 1
          fi
          team=()
          [ -n "$VERCEL_TEAM_ID" ] && team=(--data-urlencode "teamId=$VERCEL_TEAM_ID")
          base="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          list="$(mktemp)"

          code="$(curl -sS -G -o "$list" -w '%{http_code}' -H "$auth" "${team[@]}" \
            --data-urlencode "gitBranch=$GIT_BRANCH" \
            "$base/v10/projects/${VERCEL_PROJECT_ID}/env")" || code=000
          case "$code" in
            2??) ;;
            404) echo "Vercel project not found; nothing to delete."; exit 0 ;;
            *)
              echo "::error::Listing Vercel env vars failed: HTTP $code"
              exit 1
              ;;
          esac

          # Filter again client-side in case the API ignores the gitBranch query.
          ids="$(jq -r '
            [$ENV.DB_URL_KEY, $ENV.DIRECT_URL_KEY] as $keys
            | .envs[]?
            | select(.gitBranch == $ENV.GIT_BRANCH
                and ((.target // []) | if type == "array" then . else [.] end | index("preview"))
                and (.key as $k | $keys | index($k)))
            | "\(.id) \(.key)"' "$list")"
          rm -f "$list"
          if [ -z "$ids" ]; then
            echo "No Vercel preview env vars for branch $GIT_BRANCH."
            exit 0
          fi

          while read -r id key; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "${team[@]}" -G \
              "$base/v9/projects/${VERCEL_PROJECT_ID}/env/${id}")" || code=000
            case "$code" in
              2??) echo "Deleted $key from Vercel (preview, branch $GIT_BRANCH)." ;;
              404) echo "$key already gone from Vercel." ;;
              *)
                echo "::error::Deleting $key from Vercel failed: HTTP $code"
                exit 1
                ;;
            esac
          done <<<"$ids"
